<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>About - Jackie's Sketchbook</title>
  <meta name="description" content="About Jackie">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=AR+One+Sans:wght@400;500&family=Special+Elite&family=Noto+Sans+HK:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
  <style>
    :root{--bg:#F2F2F1;--text:#666666;}
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{
      background:var(--bg);color:var(--text);line-height:1.7;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    }
    .en-special{font-family:"Special Elite",serif;}
    .code{font-family:"AR One Sans",sans-serif;}
    .cn-serif{font-family:"Source Han Sans SC","Noto Sans HK","Noto Sans SC",sans-serif;}
    header{position:relative;background:transparent;z-index:100;}
    .nav{
      max-width:1200px;margin:10px auto 0;padding:0 24px;
      display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;font-size:14px;
    }
    .nav a{
      color:var(--text);text-decoration:none;opacity:.7;
      transition:all 0.2s ease;display:inline-block;transform-origin:bottom center;
    }
    .nav a:hover{opacity:1;}
    .nav a:active{color:#ccc;transform:perspective(500px) rotateX(60deg) skewX(-15deg);}
    .nav-left{justify-self:start;font-weight:500;opacity:.9;}
    .nav-center{justify-self:center;}
    .nav-right{justify-self:end;opacity:1;}
    .container{
      max-width:1200px;margin:-90px auto 0;padding:0 24px 80px;
      display:flex;justify-content:center;align-items:flex-start;
      min-height:calc(100vh - 180px);padding-top:120px;
    }
    #p5-container{position:relative;width:100%;max-width:900px;height:700px;}
    footer{border-top:1px solid rgba(0,0,0,0.08);margin-top:24px;}
    .footer-inner{
      max-width:1200px;margin:0 auto;padding:18px 24px 28px;
      display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:13px;
    }
    .footer-item b{display:block;font-weight:500;margin-bottom:6px;}
    .footer-item a{color:inherit;text-decoration:none;}
    @media (max-width:1024px){
      .container{padding-top:60px;}
      #p5-container{height:600px;}
    }
    @media (max-width:480px){
      .nav{padding:0 16px;font-size:12px;}
      .container{padding:40px 16px 64px;margin-top:50px;}
      #p5-container{height:500px;}
      .footer-inner{grid-template-columns:1fr 1fr;row-gap:16px;font-size:12px;}
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav code">
      <a class="nav-left" href="/works.html">Works</a>
      <a class="nav-center" href="/experience.html">Experience</a>
      <a class="nav-right" href="/about.html">About</a>
    </nav>
  </header>

  <main class="container">
    <div id="p5-container"></div>
  </main>

  <footer>
    <div class="footer-inner code">
      <div class="footer-item">
        <b>Email</b>
        <a id="email-link" href="" style="color:inherit;text-decoration:none;"></a>
      </div>
      <div class="footer-item">
        <b>LinkedIn</b>
        <a href="https://www.linkedin.com/in/jackie-li6699" target="_blank" rel="noopener noreferrer">linkedin.com/in/jackie-li6699</a>
      </div>
      <div class="footer-item">
        <b>More</b>
        <span>Coming soon...</span>
      </div>
    </div>
  </footer>

  <script>
    var polaroidImgs = [];
    var sakuraImg;
    var cards = [];
    var isExtracted = false;
    var extractedCard = null;
    var sakuraY = -200;
    var sakuraTargetY = 0;
    var sakuraPopupState = "IDLE";

    function preload(){
      polaroidImgs[0] = loadImage('/images/image_1.svg');
      polaroidImgs[1] = loadImage('/images/image_3.svg');
      polaroidImgs[2] = loadImage('/images/image_4.svg');
      sakuraImg = loadImage('/images/607B97BBAD6B53FF8C5D48388347E988.jpg');
    }

    function setup(){
      pixelDensity(1);
      var container = document.getElementById('p5-container');
      var c = createCanvas(container.offsetWidth, container.offsetHeight);
      c.parent('p5-container');

      textFont('Special Elite');

      var cardW = 280;
      var cardH = 350;
      var centerX = width / 2;
      var centerY = height / 2;

      cards = [
        {
          x: centerX - 190,
          y: centerY - 20,
          w: cardW,
          h: cardH,
          rotation: -0.08,
          img: polaroidImgs[0],
          type: 'photo'
        },
        {
          x: centerX,
          y: centerY - 40,
          w: cardW + 20,
          h: cardH + 30,
          rotation: 0.03,
          type: 'info',
          scale: 1
        },
        {
          x: centerX + 180,
          y: centerY - 10,
          w: cardW,
          h: cardH,
          rotation: 0.1,
          img: polaroidImgs[2],
          type: 'wechat'
        }
      ];

      sakuraTargetY = centerY - 80;
    }

    function windowResized(){
      var container = document.getElementById('p5-container');
      resizeCanvas(container.offsetWidth, container.offsetHeight);
      var centerX = width / 2;
      var centerY = height / 2;
      cards[0].x = centerX - 190;
      cards[0].y = centerY - 20;
      cards[1].x = centerX;
      cards[1].y = centerY - 40;
      cards[2].x = centerX + 180;
      cards[2].y = centerY - 10;
      sakuraTargetY = centerY - 80;
    }

    function draw(){
      background(242, 242, 241);

      handleSakuraPopup();

      for(var i = 0; i < cards.length; i++){
        var card = cards[i];
        if(isExtracted && extractedCard !== i) continue;
        drawCard(card, i);
      }

      if(sakuraPopupState !== "IDLE" || sakuraY < height + 100){
        drawSakura();
      }
    }

    function handleSakuraPopup(){
      if(frameCount % 180 === 0 && !isExtracted && sakuraPopupState === "IDLE"){
        sakuraPopupState = "POP";
      }
      if(sakuraPopupState === "POP"){
        sakuraY = lerp(sakuraY, sakuraTargetY, 0.08);
        if(abs(sakuraY - sakuraTargetY) < 5){
          sakuraPopupState = "HOLD";
          setTimeout(function(){
            sakuraPopupState = "DROP";
          }, 4000);
        }
      } else if(sakuraPopupState === "HOLD"){
        sakuraY = sakuraTargetY + sin(frameCount * 0.05) * 3;
      } else if(sakuraPopupState === "DROP"){
        sakuraY = lerp(sakuraY, height + 200, 0.08);
        if(sakuraY > height + 100){
          sakuraPopupState = "IDLE";
          sakuraY = -200;
        }
      }
    }

    function drawSakura(){
      push();
      imageMode(CENTER);
      var sakuraW = 200;
      var sakuraH = sakuraImg.height * (sakuraW / sakuraImg.width);
      translate(width / 2 - 250, sakuraY);
      rotate(-0.15);
      drawingContext.shadowColor = 'rgba(0,0,0,0.2)';
      drawingContext.shadowBlur = 15;
      drawingContext.shadowOffsetX = 3;
      drawingContext.shadowOffsetY = 5;
      image(sakuraImg, 0, 0, sakuraW, sakuraH);
      pop();
    }

    function drawCard(card, idx){
      push();
      translate(card.x, card.y);
      rotate(card.rotation);

      if(isExtracted && extractedCard === idx){
        scale(1.3);
      }

      fill(255);
      noStroke();
      drawingContext.shadowColor = 'rgba(0,0,0,0.15)';
      drawingContext.shadowBlur = 20;
      drawingContext.shadowOffsetX = 0;
      drawingContext.shadowOffsetY = 4;

      rect(-card.w/2, -card.h/2, card.w, card.h, 6);

      drawingContext.shadowColor = 'transparent';
      drawingContext.shadowBlur = 0;
      drawingContext.shadowOffsetX = 0;
      drawingContext.shadowOffsetY = 0;

      if(card.type === 'photo'){
        var photoW = card.w - 24;
        var photoH = photoW;
        imageMode(CENTER);
        image(card.img, 0, -card.h/2 + 20 + photoH/2, photoW, photoH);
        fill(102);
        textSize(11);
        textAlign(CENTER, CENTER);
        text("Jackie Li", 0, card.h/2 - 35);
      } else if(card.type === 'info'){
        var padX = 28;
        var startY = -card.h/2 + 45;
        var lineH = 26;

        fill(102);
        textSize(14);
        textAlign(LEFT, CENTER);

        text("Name: Jackie Li", -card.w/2 + padX, startY);
        text("Birthday: 2003.02.02", -card.w/2 + padX, startY + lineH);
        text("Education:", -card.w/2 + padX, startY + lineH * 2);
        textSize(12);
        text("CUC - Communication University", -card.w/2 + padX, startY + lineH * 3);
        text("of China (2021-2025)", -card.w/2 + padX, startY + lineH * 4);
        textSize(14);
        text("School: Curtin University (2025)", -card.w/2 + padX, startY + lineH * 5);
        text("Major: IMC", -card.w/2 + padX, startY + lineH * 6);
        text("Contact: l118183365@gmail.com", -card.w/2 + padX, startY + lineH * 7);

        fill(80);
        textSize(40);
        textAlign(CENTER, CENTER);
        text("?", -card.w/2 + 60, card.h/2 - 55);
      } else if(card.type === 'wechat'){
        var qrW = card.w - 50;
        var qrH = qrW;
        imageMode(CENTER);
        image(card.img, 0, -card.h/2 + 30 + qrH/2, qrW, qrH);
        fill(102);
        textSize(12);
        textAlign(CENTER, CENTER);
        text("WeChat: l118183365", 0, card.h/2 - 30);
      }

      pop();
    }

    function mousePressed(){
      if(isExtracted){
        isExtracted = false;
        extractedCard = null;
        return;
      }
      for(var i = 0; i < cards.length; i++){
        var card = cards[i];
        if(mouseX > card.x - card.w/2 && mouseX < card.x + card.w/2 &&
           mouseY > card.y - card.h/2 && mouseY < card.y + card.h/2){
          isExtracted = true;
          extractedCard = i;
          break;
        }
      }
    }
  </script>

  <script>
    (function(){
      var user = 'l118183365';
      var dom = 'gm' + 'ail.c' + 'om';
      var addr = user + '@' + dom;
      var el = document.getElementById('email-link');
      if(el){
        el.href = 'mailto:' + addr;
        el.textContent = addr;
      }
    })();
  </script>
</body>
</html>
