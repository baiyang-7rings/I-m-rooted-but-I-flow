<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Works - Jackie's Sketchbook</title>
  <meta name="description" content="Jackie's works portfolio">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=AR+One+Sans:wght@400;500&family=Special+Elite&family=Noto+Sans+HK:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#F2F2F1;--text:#666666;}
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{
      background:var(--bg);color:var(--text);line-height:1.7;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    }
    .en-special{font-family:"Special Elite",serif;}
    .code{font-family:"AR One Sans",sans-serif;}
    .cn-serif{font-family:"Source Han Sans SC","Noto Sans HK","Noto Sans SC",sans-serif;}
    header{position:relative;background:transparent;z-index:100;}
    .nav{
      max-width:1200px;margin:10px auto 0;padding:0 24px;
      display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;font-size:14px;
    }
    .nav a{
      color:var(--text);text-decoration:none;opacity:.7;
      transition:all 0.2s ease;display:inline-block;transform-origin:bottom center;
    }
    .nav a:hover{opacity:1;}
    .nav a:active{color:#ccc;transform:perspective(500px) rotateX(60deg) skewX(-15deg);}
    .nav-left{justify-self:start;font-weight:500;opacity:1;}
    .nav-center{justify-self:center;}
    .nav-right{justify-self:end;}
    .container{
      max-width:1200px;margin:-90px auto 0;padding:120px 24px 80px;
      min-height:calc(100vh - 180px);
    }
    .section{margin-bottom:100px;}
    .section-title{
      font-family:"Special Elite",serif;font-size:24px;font-weight:500;
      text-align:center;margin-bottom:50px;color:var(--text);
    }

    .projects-container{
      display:flex;justify-content:center;align-items:center;
      perspective:1200px;min-height:450px;position:relative;
    }
    .folder{
      position:relative;width:380px;height:320px;cursor:pointer;
      transform-style:preserve-3d;transition:transform 0.6s ease;
    }
    .folder:hover{transform:translateY(-10px);}
    .folder.open .folder-cover{transform:rotateY(-160deg);}
    .folder.open .folder-back{transform:translateX(80px);}
    .folder-cover{
      position:absolute;top:0;left:0;width:100%;height:100%;
      background:linear-gradient(135deg,#d4c4a8 0%,#c9b896 100%);
      border-radius:4px 8px 8px 4px;
      transform-origin:left center;transition:transform 0.7s cubic-bezier(0.4,0,0.2,1);
      z-index:10;box-shadow:2px 2px 10px rgba(0,0,0,0.15);
      backface-visibility:hidden;
    }
    .folder-cover::before{
      content:'';position:absolute;top:0;left:0;right:0;height:35px;
      background:linear-gradient(180deg,#c9b896 0%,#bfae82 100%);
      border-radius:4px 8px 0 0;
    }
    .folder-cover-label{
      position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      font-family:"Special Elite",serif;font-size:20px;color:#5a4d3a;
      text-align:center;
    }
    .folder-back{
      position:absolute;top:0;left:0;width:100%;height:100%;
      background:linear-gradient(135deg,#e8dcc8 0%,#ddd0b8 100%);
      border-radius:4px 8px 8px 4px;z-index:5;
      transition:transform 0.6s ease;box-shadow:inset 2px 0 8px rgba(0,0,0,0.08);
    }
    .folder-pages{
      position:absolute;top:15px;left:15px;right:-15px;bottom:15px;
      background:#fff;border-radius:2px;z-index:8;
      box-shadow:3px 3px 12px rgba(0,0,0,0.12);
      padding:25px;overflow:hidden;
    }
    .project-card{
      position:absolute;width:260px;height:200px;
      background:#fff;border-radius:3px;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
      cursor:pointer;transition:all 0.4s cubic-bezier(0.4,0,0.2,1);
      transform-origin:center center;
    }
    .project-card:hover{
      box-shadow:0 12px 35px rgba(0,0,0,0.2);
      transform:translateY(-8px) scale(1.02)!important;
      z-index:20!important;
    }
    .project-card:nth-child(1){
      top:30px;left:20px;transform:rotate(-6deg);z-index:11;
    }
    .project-card:nth-child(2){
      top:50px;left:70px;transform:rotate(4deg);z-index:12;
    }
    .project-card:nth-child(3){
      top:70px;left:120px;transform:rotate(-3deg);z-index:13;
    }
    .project-thumb{
      width:100%;height:150px;object-fit:cover;
      border-radius:3px 3px 0 0;
    }
    .project-title{
      font-family:"Special Elite",serif;font-size:13px;
      padding:10px 12px;color:#555;margin:0;
    }
    .project-preview{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.7);z-index:1000;
      display:none;justify-content:center;align-items:center;
      padding:40px;
    }
    .project-preview.active{display:flex;}
    .preview-content{
      background:#fff;border-radius:6px;max-width:700px;
      max-height:90vh;overflow:auto;padding:20px;position:relative;
    }
    .preview-img{
      width:100%;height:auto;border-radius:4px;display:block;
    }
    .preview-close{
      position:absolute;top:15px;right:20px;font-size:28px;
      cursor:pointer;color:#999;background:none;border:none;
      font-family:inherit;
    }
    .preview-close:hover{color:#333;}

    .pinboard-container{
      position:relative;width:100%;height:600px;
      background:linear-gradient(145deg,#e8dcc4 0%,#d9c9a8 100%);
      border-radius:6px;overflow:hidden;
      box-shadow:inset 0 2px 10px rgba(0,0,0,0.15);
    }
    .pinboard-container::before{
      content:'';position:absolute;top:0;left:0;right:0;bottom:0;
      background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E");
      pointer-events:none;
    }
    .pinned-item{
      position:absolute;cursor:pointer;
      transition:all 0.3s ease;padding:12px 12px 30px 12px;
      background:#fff;border-radius:2px;
      box-shadow:0 3px 10px rgba(0,0,0,0.15);
      width:240px;
    }
    .pinned-item:hover{
      box-shadow:0 15px 40px rgba(0,0,0,0.3);
      transform:translateY(-12px) scale(1.03) rotate(0deg)!important;
      z-index:100;
    }
    .pin{
      position:absolute;top:-8px;left:50%;transform:translateX(-50%);
      width:18px;height:18px;border-radius:50%;
      background:radial-gradient(circle at 35% 35%,#ffb3b3,#e74c3c 60%,#c0392b);
      box-shadow:0 3px 6px rgba(0,0,0,0.3),inset 0 1px 2px rgba(255,255,255,0.4);
      z-index:10;
    }
    .pin::after{
      content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      width:5px;height:5px;border-radius:50%;
      background:rgba(255,255,255,0.6);
    }
    .pin-thumb{
      width:100%;height:160px;object-fit:cover;
      border-radius:1px;margin-bottom:10px;
    }
    .pin-title{
      font-family:"Special Elite",serif;font-size:14px;
      color:#444;margin:0 0 6px 0;line-height:1.3;
    }
    .pin-desc{
      font-family:"AR One Sans",sans-serif;font-size:11px;
      color:#777;margin:0;line-height:1.5;
    }
    .leadership-modal{
      position:fixed;top:0;left:0;width:100%;height:100%;
      background:rgba(0,0,0,0.8);z-index:1000;
      display:none;justify-content:center;align-items:center;
      padding:40px;
    }
    .leadership-modal.active{display:flex;}
    .modal-content{
      background:#fff;border-radius:6px;max-width:800px;width:100%;
      max-height:90vh;overflow:auto;padding:30px;position:relative;
    }
    .modal-img{
      width:100%;height:auto;border-radius:4px;margin-bottom:20px;
    }
    .modal-title{
      font-family:"Special Elite",serif;font-size:24px;margin:0 0 15px 0;
      color:#333;
    }
    .modal-desc{
      font-family:"AR One Sans",sans-serif;font-size:15px;
      color:#666;line-height:1.8;
    }
    .modal-close{
      position:absolute;top:15px;right:20px;font-size:28px;
      cursor:pointer;color:#999;background:none;border:none;
      font-family:inherit;
    }
    .modal-close:hover{color:#333;}

    footer{border-top:1px solid rgba(0,0,0,0.08);margin-top:24px;}
    .footer-inner{
      max-width:1200px;margin:0 auto;padding:18px 24px 28px;
      display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:13px;
    }
    .footer-item b{display:block;font-weight:500;margin-bottom:6px;}
    .footer-item a{color:inherit;text-decoration:none;}
    @media (max-width:1024px){
      .folder{width:320px;height:280px;}
      .project-card{width:220px;height:170px;}
      .pinboard-container{height:550px;}
      .pinned-item{width:200px;}
    }
    @media (max-width:480px){
      .nav{padding:0 16px;font-size:12px;}
      .container{padding:60px 16px 64px;margin-top:50px;}
      .section{margin-bottom:60px;}
      .section-title{font-size:20px;margin-bottom:30px;}
      .folder{width:280px;height:240px;}
      .project-card{width:180px;height:140px;}
      .pinboard-container{height:auto;min-height:700px;}
      .pinned-item{width:85%;left:50%!important;top:auto!important;
        transform:translateX(-50%)!important;position:relative;margin-bottom:20px;}
      .footer-inner{grid-template-columns:1fr 1fr;row-gap:16px;font-size:12px;}
    }
  </style>
</head>
<body>
  <header>
    <nav class="nav code">
      <a class="nav-left" href="/works.html">Works</a>
      <a class="nav-center" href="/experience.html">Experience</a>
      <a class="nav-right" href="/about.html">About</a>
    </nav>
  </header>

  <main class="container">
    <section class="section">
      <h2 class="section-title">Projects</h2>
      <div class="projects-container">
        <div class="folder" id="projectsFolder">
          <div class="folder-back"></div>
          <div class="folder-pages">
            <div class="project-card" data-preview="1">
              <img class="project-thumb" src="/images/spark-activity.jpg" alt="Project 1">
              <p class="project-title">Social Media Campaign</p>
            </div>
            <div class="project-card" data-preview="2">
              <img class="project-thumb" src="/images/ecommerce-dashboard.png" alt="Project 2">
              <p class="project-title">Brand Design</p>
            </div>
          </div>
          <div class="folder-cover">
            <div class="folder-cover-label">Social Media<br>Content</div>
          </div>
        </div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">Leadership</h2>
      <div class="pinboard-container" id="pinboard">
      </div>
    </section>
  </main>

  <div class="project-preview" id="projectPreview">
    <div class="preview-content">
      <button class="preview-close" id="previewClose">&times;</button>
      <img class="preview-img" id="previewImg" src="" alt="Project preview">
    </div>
  </div>

  <div class="leadership-modal" id="leadershipModal">
    <div class="modal-content">
      <button class="modal-close" id="modalClose">&times;</button>
      <img class="modal-img" id="modalImg" src="" alt="Leadership preview">
      <h3 class="modal-title" id="modalTitle"></h3>
      <p class="modal-desc" id="modalDesc"></p>
    </div>
  </div>

  <footer>
    <div class="footer-inner code">
      <div class="footer-item">
        <b>Email</b>
        <a id="email-link" href="" style="color:inherit;text-decoration:none;"></a>
      </div>
      <div class="footer-item">
        <b>LinkedIn</b>
        <a href="https://www.linkedin.com/in/jackie-li6699" target="_blank" rel="noopener noreferrer">linkedin.com/in/jackie-li6699</a>
      </div>
      <div class="footer-item">
        <b>More</b>
        <span>Coming soon...</span>
      </div>
    </div>
  </footer>

  <script>
    (function(){
      var folder = document.getElementById('projectsFolder');
      var isOpen = false;
      folder.addEventListener('click', function(e){
        if(e.target.closest('.project-card')) return;
        isOpen = !isOpen;
        folder.classList.toggle('open', isOpen);
      });

      var projectPreview = document.getElementById('projectPreview');
      var previewImg = document.getElementById('previewImg');
      var previewClose = document.getElementById('previewClose');

      document.querySelectorAll('.project-card').forEach(function(card){
        card.addEventListener('click', function(e){
          e.stopPropagation();
          var id = card.getAttribute('data-preview');
          var imgSrc = id === '1' ? '/images/spark-activity.jpg' : '/images/ecommerce-dashboard.png';
          previewImg.src = imgSrc;
          projectPreview.classList.add('active');
        });
      });
      previewClose.addEventListener('click', function(){
        projectPreview.classList.remove('active');
      });
      projectPreview.addEventListener('click', function(e){
        if(e.target === projectPreview) projectPreview.classList.remove('active');
      });

      var leadershipItems = [
        {
          img: '/images/article1.jpg',
          title: 'Student Union Leader',
          desc: 'Led a team of 20+ members to organize campus events and activities.'
        },
        {
          img: '/images/article2.jpg',
          title: 'Club President',
          desc: 'Managed club operations and hosted multiple successful workshops.'
        }
      ];

      var pinboard = document.getElementById('pinboard');
      var positions = [
        {top: 60, left: 80, rot: -5},
        {top: 80, left: 380, rot: 4}
      ];

      leadershipItems.forEach(function(item, idx){
        var el = document.createElement('div');
        el.className = 'pinned-item';
        var pos = positions[idx] || {top: 100 + idx * 200, left: 100, rot: Math.random() * 10 - 5};
        el.style.top = pos.top + 'px';
        el.style.left = pos.left + 'px';
        el.style.transform = 'rotate(' + pos.rot + 'deg)';
        el.innerHTML = '<div class="pin"></div>' +
          '<img class="pin-thumb" src="' + item.img + '" alt="' + item.title + '">' +
          '<p class="pin-title">' + item.title + '</p>' +
          '<p class="pin-desc">' + item.desc + '</p>';
        el.addEventListener('click', function(){
          document.getElementById('modalImg').src = item.img;
          document.getElementById('modalTitle').textContent = item.title;
          document.getElementById('modalDesc').textContent = item.desc;
          document.getElementById('leadershipModal').classList.add('active');
        });
        pinboard.appendChild(el);
      });

      var leadershipModal = document.getElementById('leadershipModal');
      var modalClose = document.getElementById('modalClose');
      modalClose.addEventListener('click', function(){
        leadershipModal.classList.remove('active');
      });
      leadershipModal.addEventListener('click', function(e){
        if(e.target === leadershipModal) leadershipModal.classList.remove('active');
      });
    })();
  </script>

  <script>
    (function(){
      var user = 'l118183365';
      var dom = 'gm' + 'ail.c' + 'om';
      var addr = user + '@' + dom;
      var el = document.getElementById('email-link');
      if(el){
        el.href = 'mailto:' + addr;
        el.textContent = addr;
      }
    })();
  </script>
</body>
</html>
