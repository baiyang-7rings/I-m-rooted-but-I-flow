<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jackie's Portfolio</title>
  
  <!-- 引入字体 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Special Elite 字体 (英文标题) -->
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
  <!-- AR One Sans 字体 (导航栏) -->
  <link href="https://fonts.googleapis.com/css2?family=AR+One+Sans:wght@400;500&display=swap" rel="stylesheet">
  <!-- 思源黑体简体 / Noto Sans SC (中文) -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;700&display=swap" rel="stylesheet">
  <!-- Source Code Pro -->
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- 引入 P5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  
  <style>
    /* ================= 基础样式 ================= */
    :root {
      --bg-color: #F2F2F1;
      --text-color: #000000;
      --muted-color: #666666;
      --border-color: #DDDDDD;
      --font-main: "Special Elite", "Noto Sans SC", "Source Han Sans SC", "Source Han Sans", sans-serif;
      --font-code: "AR One Sans", sans-serif;
      --font-chinese: "Noto Sans SC", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-main);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      overflow-y: auto;
    }

    a {
      color: var(--text-color);
      text-decoration: none;
      position: relative;
    }
    
    a:hover {
      text-decoration: underline;
    }

    /* ================= 布局容器 ================= */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      position: relative;
      z-index: 20; /* 提高整个容器的层级，确保内容在 Gallery 之上 */
      pointer-events: none; /* 让容器本身不阻挡点击 */
    }
    
    /* 恢复导航栏交互 */
    .nav-links {
      pointer-events: auto;
    }
    
    /* 恢复标题交互（可选中文本） */
    .page-title {
      pointer-events: auto;
    }
    
    /* 恢复副标题交互 */
    .subtitle {
      pointer-events: auto;
    }
    
    /* 确保 spacer 不阻挡点击 */
    .canvas-spacer {
      pointer-events: none;
    }

    /* ================= 顶部导航 ================= */
    header {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding-top: 10px;
      margin-bottom: 20px;
      position: relative;
      /* z-index: 20;  已在 container 中统一提高层级 */
    }

    .nav-links {
      display: flex;
      gap: 30px;
      font-size: 14px;
      color: #999;
      margin: 0;
      font-family: var(--font-code);
    }
    
    .nav-links a { 
      color: #999; 
      transition: all 0.2s ease;
      display: inline-block;
      text-decoration: none;
      transform-origin: bottom center; /* 旋转轴在底部 */
    }
    .nav-links a:hover { 
      color: #333; 
    }
    .nav-links a:active {
      color: #ccc; /* 颜色变浅 */
      text-shadow: none;
      transform: perspective(500px) rotateX(60deg) skewX(-15deg); /* 向斜后方倾倒 */
    }

    /* ================= 页面标题 ================= */
    .page-title {
      font-size: 48px;
      font-weight: bold;
      letter-spacing: -1px;
      margin-bottom: 0px;
      font-family: var(--font-main);
      position: relative;
      z-index: 10;
    }

    /* ================= P5.js Canvas 容器 ================= */
    .canvas-container {
      position: absolute;
      top: 40px;
      left: 0;
      width: 100vw;
      z-index: 0;
    }

    #p5-canvas {
      width: 100% !important;
      height: auto !important;
      display: block;
      cursor: pointer;
    }
    
    /* 内容区域 */
    .content-wrapper {
      position: relative;
      z-index: 1;
      pointer-events: none;
    }
    
    /* 删除暴力的通配符恢复，改为按需恢复 */
    /* .content-wrapper * {
      pointer-events: auto;
    } */
    
    /* 确保 spacer 不阻挡点击 */
    .canvas-spacer {
      pointer-events: none;
    }

    /* Canvas 占位空间 */
    .canvas-spacer {
      width: 100%;
      padding-top: 48.67%; /* 623/1280 = 0.4867 保持原始比例 */
      margin-top: 105px;
    }

    /* ================= 图片展示区域 ================= */
    .gallery-container {
      position: absolute;
      top: 130px;
      left: 0;
      width: 100%;
      height: 400px;
      z-index: 200;
      pointer-events: none;
      overflow: hidden;
      display: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .gallery-container.show {
      opacity: 1;
      pointer-events: auto;
      display: flex !important;
    }

    /* --- Projects Gallery (graphicDesignGallery) - Accordion Folder --- */
    #graphicDesignGallery {
      position: absolute;
      top: 130px;
      width: 100%;
      height: 400px;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      padding: 0;
    }
    #graphicDesignGallery.show {
      display: flex !important;
      opacity: 1;
      pointer-events: auto;
    }

    /* --- Leadership Gallery (visualDisplayGallery) - Single Card --- */
    #visualDisplayGallery {
      position: absolute;
      top: 130px;
      width: 100%;
      height: 400px;
      z-index: 200;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    #visualDisplayGallery.show {
      display: flex !important;
      opacity: 1;
      pointer-events: auto;
    }

    .leadership-card {
      max-width: 420px;
      width: 90%;
      background: #f6f3ea;
      border: 1px solid rgba(0,0,0,0.1);
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.1'/%3E%3C/svg%3E");
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }
    .leadership-card .card-pin {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 12px;
      height: 12px;
      background: #999;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3), inset 0 1px 2px rgba(255,255,255,0.3);
      z-index: 10;
    }
    .leadership-card .card-image {
      width: 100%;
      max-height: 160px;
      object-fit: cover;
      display: block;
    }
    .leadership-card .card-body {
      padding: 18px 22px;
    }
    .leadership-card .card-title {
      font-family: 'Special Elite', serif;
      font-size: 15px;
      color: #222;
      margin-bottom: 4px;
    }
    .leadership-card .card-subtitle {
      font-family: 'AR One Sans', sans-serif;
      font-size: 10px;
      color: #888;
      margin-bottom: 10px;
    }
    .leadership-card .card-desc {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 11px;
      line-height: 1.6;
      color: #444;
    }

    /* --- Content Showcase Gallery (socialMediaGallery) - Left List + Right Phone --- */
    #socialMediaGallery {
      display: none;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 24px;
      padding: 20px;
      position: absolute;
      top: 130px;
      width: 100%;
      height: 400px;
      z-index: 200;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    #socialMediaGallery.show {
      opacity: 1;
      pointer-events: auto;
      display: flex !important;
    }

    .article-list {
      width: 220px;
      max-height: 380px;
      overflow-y: auto;
      flex-shrink: 0;
    }
    .article-list-card {
      background: #fff;
      border: 1px solid #eee;
      border-radius: 4px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }
    .article-list-card.active {
      border-left: 3px solid #07c160;
      background: #f9f9f9;
    }
    .article-list-card:hover {
      border-color: #ccc;
    }
    .article-list-card .list-heart {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 14px;
      color: #ccc;
      cursor: pointer;
      user-select: none;
      transition: color 0.2s;
    }
    .article-list-card .list-heart.liked {
      color: #ff4d4f;
    }
    .article-list-card .list-title {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #333;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      padding-right: 18px;
    }
    .article-list-card .list-date {
      font-family: 'AR One Sans', sans-serif;
      font-size: 9px;
      color: #999;
      margin-top: 4px;
    }
    .article-hint {
      font-family: 'AR One Sans', sans-serif;
      font-size: 10px;
      color: #999;
      text-align: center;
      margin-top: 8px;
    }

    /* Phone Mockup (new compact version) */
    .wx-phone-frame {
      width: 260px;
      height: 380px;
      background: #1a1a1a;
      border-radius: 32px;
      padding: 8px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.3);
      position: relative;
      flex-shrink: 0;
    }
    .wx-phone-frame::before {
      content: '';
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 70px;
      height: 18px;
      background: #1a1a1a;
      border-radius: 0 0 14px 14px;
      z-index: 100;
    }
    .wx-phone-frame::after {
      content: '';
      position: absolute;
      bottom: 5px;
      left: 50%;
      transform: translateX(-50%);
      width: 80px;
      height: 3px;
      background: #333;
      border-radius: 2px;
      z-index: 100;
    }
    .wx-phone-status-bar {
      position: absolute;
      top: 0;
      left: 8px;
      right: 8px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-family: -apple-system, sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: #000;
      z-index: 50;
      pointer-events: none;
    }
    .wx-phone-screen {
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .wx-header {
      background: #ededed;
      padding: 36px 8px 6px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
      min-height: 32px;
    }
    .wx-header-back {
      font-size: 16px;
      color: #333;
      padding: 2px 6px;
      cursor: pointer;
    }
    .wx-header-title {
      flex: 1;
      text-align: center;
      font-size: 13px;
      font-weight: 500;
      color: #333;
      font-family: -apple-system, "Noto Sans SC", sans-serif;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 6px;
    }
    .wx-header-more {
      font-size: 16px;
      color: #333;
      padding: 2px 6px;
    }
    .wx-article-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    .wx-article-scroll img {
      width: 100%;
      display: block;
    }
    .wx-bottom-bar {
      height: 36px;
      background: #f7f7f7;
      border-top: 1px solid #e0e0e0;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 0 10px;
      flex-shrink: 0;
    }
    .wx-action-btn {
      font-size: 16px;
      cursor: pointer;
      color: #666;
      display: flex;
      align-items: center;
      gap: 3px;
      user-select: none;
    }
    .wx-action-btn.liked {
      color: #ff4d4f;
    }
    .wx-action-btn span {
      font-size: 10px;
      font-family: 'AR One Sans', sans-serif;
    }

    /* --- Accordion Folder Styles (for Projects gallery) --- */
    .accordion-stage {
      position: relative;
      width: 340px;
      height: 380px;
      display: flex;
      justify-content: center;
      align-items: center;
      transform-style: preserve-3d;
      perspective: 1200px;
    }

    .folder-page {
      position: absolute;
      top: 0;
      left: 50%;
      margin-left: -160px;
      width: 320px;
      height: 380px;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.6s ease;
      transform-style: preserve-3d;
      cursor: pointer;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      background-color: #f6f3ea;
      background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.12'/%3E%3C/svg%3E");
      border: 1px solid rgba(0,0,0,0.1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      will-change: transform;
      border-radius: 3px;
    }

    .folder-page .ripple-layer {
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at center, rgba(64, 158, 255, 0.06) 0%, rgba(64, 158, 255, 0) 50%);
      opacity: 0.8;
      pointer-events: none;
      mix-blend-mode: multiply;
      animation: rippleFlow 12s infinite ease-in-out alternate;
      z-index: 5;
    }

    @keyframes rippleFlow {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(10px, 15px) scale(1.05); }
      100% { transform: translate(-5px, -10px) scale(1); }
    }

    .folder-page.shadow-light::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.06), rgba(0,0,0,0));
      pointer-events: none;
      z-index: 10;
    }
    .folder-page.shadow-medium::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to right, rgba(0,0,0,0.15), rgba(0,0,0,0.05));
      pointer-events: none;
      z-index: 10;
    }

    .folder-page .page-content-wrapper {
      position: relative;
      z-index: 6;
      width: 100%;
      height: 100%;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      background: transparent;
      backface-visibility: hidden;
      overflow-y: auto;
    }
    .folder-page .proj-title {
      font-family: 'Special Elite', serif;
      font-size: 15px;
      color: #222;
      margin-bottom: 4px;
      flex-shrink: 0;
    }
    .folder-page .proj-subtitle {
      font-family: 'AR One Sans', sans-serif;
      font-size: 10px;
      color: #888;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .folder-page .proj-image {
      width: 100%;
      max-height: 120px;
      object-fit: cover;
      border-radius: 3px;
      margin: 8px 0;
      flex-shrink: 0;
    }
    .folder-page .proj-desc {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 11px;
      line-height: 1.6;
      color: #444;
      flex-shrink: 0;
    }
    .folder-page .proj-tags {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      flex-shrink: 0;
    }
    .folder-page .proj-tag {
      border: 1px solid #ccc;
      border-radius: 50px;
      padding: 2px 8px;
      font-size: 9px;
      color: #888;
      font-family: 'AR One Sans', sans-serif;
      display: inline-block;
    }

    /* --- 弹出窗口样式 --- */
    .image-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .image-modal.show {
      display: flex;
    }
    .modal-backdrop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.8);
      cursor: pointer;
    }
    .modal-content {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 1001;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .modal-content img {
      max-width: 90vw;
      max-height: 90vh;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0,0,0,0.5);
      cursor: grab;
    }
    .modal-content img:active {
      cursor: grabbing;
    }

    /* ================= 底部 Footer ================= */
    footer{
      border-top:1px solid rgba(0,0,0,0.08);
      margin-top:24px;
    }
    .footer-inner{
      max-width:1200px;
      margin:0 auto;
      padding:18px 24px 28px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:12px;
      font-size:13px;
      color: #666666;
      font-family: "AR One Sans", sans-serif;
    }
    .footer-item b{
      display:block;
      font-weight:500;
      margin-bottom:6px;
      color: #666666;
    }
    .footer-item span {
      opacity: 1;
    }

    /* ================= 响应式设计 ================= */
    @media (min-width: 481px) and (max-width: 1200px) {
      .canvas-container {
        position: absolute !important;
        left: 0;
        z-index: 0;
        width: 100vw;
      }
      footer {
        position: relative;
        margin-top: 0;
        z-index: 10;
        width: 100%;
      }
      .container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      .canvas-spacer {
        display: none;
      }
    }

    @media (max-width: 768px) {
      .page-title {
        font-size: 36px;
      }
      .canvas-container {
        margin-bottom: 40px;
      }
    }

    @media (max-width: 480px) {
      .nav-links {
        gap: 20px;
        font-size: 12px;
      }
      .page-title {
        font-size: 28px;
      }
      .footer-inner{
        grid-template-columns:1fr 1fr;
        row-gap:16px;
        font-size:12px;
      }

      body.locked-scroll {
        overflow: hidden;
      }

      .canvas-container {
        position: fixed;
        top: auto;
        bottom: 0;
        left: 0;
        height: 500px !important;
        z-index: 20;
        pointer-events: none;
      }
      #p5-canvas {
        height: 100% !important;
        width: 100% !important;
        object-fit: cover;
        object-position: center bottom;
        pointer-events: auto;
      }

      footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        z-index: 30;
        background: transparent;
        border-top: none;
        margin-top: 0;
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        height: 60px;
        overflow-y: auto;
        overscroll-behavior: contain;
        transform: none !important;
      }
      .footer-inner {
        padding: 5px 24px 5px;
      }

      /* Mobile gallery positioning */
      #graphicDesignGallery,
      #visualDisplayGallery,
      #socialMediaGallery {
        top: 90px !important;
        bottom: 220px !important;
        height: auto !important;
        min-height: 200px;
        overflow-y: auto;
        z-index: 25;
        padding: 10px !important;
      }

      /* Social media mobile: column layout */
      #socialMediaGallery {
        flex-direction: column !important;
        gap: 12px !important;
      }
      #socialMediaGallery .wx-phone-frame {
        width: 240px;
        height: 360px;
      }
      #socialMediaGallery .article-list {
        width: 260px;
        max-height: 160px;
      }

      /* Hide accordion in social media context only */
      #socialMediaGallery .accordion-stage {
        display: none !important;
      }
      #socialMediaGallery .folder-page {
        display: none !important;
      }

      /* Projects folder mobile adjustments */
      .accordion-stage {
        width: 90vw;
        height: 350px;
      }
      .folder-page {
        width: 85vw;
        height: 350px;
      }

      .leadership-card {
        width: 95%;
      }
    }
  </style>
</head>
<body>

  <div class="canvas-container" id="canvas-container">
    <!-- P5.js 会在这里创建 canvas -->
  </div>

  <!-- Graphic Design 图片展示区域 -->
  <div class="gallery-container" id="graphicDesignGallery" style="display: none;">
    <!-- 图片将通过JavaScript动态添加 -->
  </div>

  <!-- Visual Display 图片展示区域 -->
  <div class="gallery-container" id="visualDisplayGallery" style="display: none;">

    function updateTargetPositions() {
      let currentGapY = hasBeenClicked ? config.lineGapCompressed : config.lineGapInitial;
      // 固定最底部线条的位置，从底部往上计算
      let lastLineY = height - config.paddingBottom * scaleFactor; // 这里控制最底部线条的位置
      let firstLineY = lastLineY - (2 * currentGapY * scaleFactor);

      for (let i = 0; i < waves.length; i++) {
        waves[i].homeY = firstLineY + i * currentGapY * scaleFactor;
      }
    }

    // ================= Wave 类 =================
    class Wave {
      constructor(y, txt, id, fullWidth) {
        this.homeY = y;
        this.currentY = y;
        this.txt = txt;
        this.id = id;
        this.state = 'IDLE';
        this.displayOpacity = 255;
        this.textBaseWidth = fullWidth;
        this.currentTextScale = 1.0; 
        this.waterTrails = [];
        this.noiseSeed = random(1000);
        this.centerX = [width * 0.28, width * 0.5, width * 0.72][id];
        this.imageOpacity = 0; // 图片透明度
        this.imageElement = null; // 将在setup中初始化
      }

      update() {
        if (activeWaveIdx !== -1 && activeWaveIdx !== this.id) {
          this.displayOpacity = lerp(this.displayOpacity, 0, 0.15);
        } else {
          this.displayOpacity = lerp(this.displayOpacity, 255, 0.1);
        }

        if (this.state === 'RISING') {
          this.currentY = lerp(this.currentY, config.topBoundary * scaleFactor, config.riseSpeed);
          this.currentTextScale = lerp(this.currentTextScale, 0, config.closingSpeed);
          this.generateFullWidthTrails();
          // 隐藏所有图片
          hideAllGalleries();
          currentDisplayedImageId = -1;
          if (this.currentY <= config.topBoundary * scaleFactor + 2) {
            this.state = 'FALLING';
          }
        } 
        else if (this.state === 'FALLING') {
          // 优化：使用 lerp 代替固定速度，使下落更平滑，并确保能够准确到达目标位置
          // 之前是 += speed，容易产生抖动或过冲
          // 使用一个稍快的 lerp 因子
          this.currentY = lerp(this.currentY, this.homeY, 0.08); 
          
          if (this.currentY > this.homeY - 150 * scaleFactor) {
            this.currentTextScale = lerp(this.currentTextScale, 1.0, 0.08); 
          }
          // 计算图片渐显进度
          let fallProgress = (this.currentY - config.topBoundary * scaleFactor) / (this.homeY - config.topBoundary * scaleFactor);
          fallProgress = constrain(fallProgress, 0, 1);
          // 当波浪下降到一定程度后开始显示图片
          if (fallProgress > 0.3) { // Graphic Design 延后出现，从 0.1 改为 0.3
             // Graphic Design 使用 CSS 动画
             if (this.id === 0) {
                showGalleryForWave(this.id);
             } else if (this.id === 1) {
                // Visual Display 使用 JS 复杂动画，只触发一次
                if (currentDisplayedImageId !== 1) {
                   showGalleryForWave(this.id);
                   currentDisplayedImageId = 1; // 标记已触发，防止重复触发
                }
             } else {
                showGalleryForWave(this.id);
             }
          }
          
          // 判断结束条件：非常接近目标位置时停止
          if (abs(this.currentY - this.homeY) < 1.0) {
            this.currentY = this.homeY; // 强制吸附
            this.state = 'IDLE';
            activeWaveIdx = -1;
            // 图片保持显示，不隐藏
            this.imageOpacity = 1;
            currentDisplayedImageId = this.id;
            showGalleryForWave(this.id, 1);
            
            // [New] Unlock scroll on mobile when animation finishes
            if (isMobileMode) {
               document.body.classList.remove('locked-scroll');
            }
          }
        } else {
          this.currentY = lerp(this.currentY, this.homeY, 0.1);
          this.currentTextScale = lerp(this.currentTextScale, 1.0, 0.1);
          // IDLE状态时，如果这是当前显示的图片，保持显示
          if (this.id === currentDisplayedImageId) {
            this.imageOpacity = 1;
            showGalleryForWave(this.id, 1);
          }
        }

        for (let i = this.waterTrails.length - 1; i >= 0; i--) {
          let t = this.waterTrails[i];
          t.y += t.speed * scaleFactor;
          t.opacity -= 3;
          if (t.opacity <= 0) this.waterTrails.splice(i, 1);
        }
      }

      display() {
        if (this.displayOpacity < 5) return;

        push();
        // 1. 绘制颗粒
        for (let t of this.waterTrails) {
          stroke(180, 190, 200, t.opacity * (this.displayOpacity / 255));
          strokeWeight(t.thickness * scaleFactor);
          line(t.x, t.y, t.x, t.y + t.len * scaleFactor);
        }

        // 2. 绘制【绝对完整】的波浪线
        for (let i = 0; i < 2; i++) {
          let yOff = i * 4 * scaleFactor;
          let alpha = i === 0 ? 255 : 80;
          stroke(0, alpha * (this.displayOpacity / 255));
          strokeWeight(i === 0 ? 1.5 * scaleFactor : 0.8 * scaleFactor);
          noFill();
          this.drawSingleLongWave(yOff);
        }

        // 3. 【核心步骤】遮挡线条 - 使用网页背景色
        let gapWidth = this.textBaseWidth * this.currentTextScale;
        if (gapWidth > 0.5) {
          noStroke();
          // Tablet mode fix: Ensure background color matches body color #F2F2F1 (242, 242, 241)
          fill(242, 242, 241); 
          rectMode(CENTER);
          rect(this.centerX, this.currentY + 2 * scaleFactor, gapWidth, 20 * scaleFactor); 
        }

        // 4. 绘制文字
        if (this.currentTextScale > 0.02) {
          push();
          translate(this.centerX, this.currentY + 2 * scaleFactor);
          scale(this.currentTextScale, 1.0);
          noStroke();
          // Tablet mode: Ensure text is visible (black)
          fill(0, this.displayOpacity * Math.pow(this.currentTextScale, 1.5));
          textAlign(CENTER, CENTER);
          textSize(16 * scaleFactor);
          text(this.txt, 0, 0);
          pop();
        }
        pop();
      }

      // 只画一根线，从头到尾
      drawSingleLongWave(yOffset) {
        beginShape();
        let gapHalf = (this.textBaseWidth * this.currentTextScale) / 2;
        
        curveVertex(-20, this.currentY + yOffset);
        for (let x = 0; x <= width; x += 15 * scaleFactor) {
          let nx = x * 0.004 / scaleFactor;
          let noiseVal = noise(nx, this.noiseSeed + yOffset);
          let baseMod = map(noiseVal, 0, 1, -25, 25) * config.waveCurvature * scaleFactor;
          
          // 平滑逻辑：在文字区域把波浪压平
          let distToCenter = abs(x - this.centerX);
          let taper = map(distToCenter, gapHalf * 0.5, gapHalf * 1.5, 0, 1, true);
          if (this.currentTextScale < 0.1) taper = 1;

          curveVertex(x, this.currentY + yOffset + baseMod * taper);
        }
        curveVertex(width + 20, this.currentY + yOffset);
        endShape();
      }

      generateFullWidthTrails() {
        for (let i = 0; i < config.trailDensity; i++) {
          let rx = random(0, width);
          let gapHalf = (this.textBaseWidth * this.currentTextScale) / 2;
          // 颗粒也不要在文字遮挡区产生
          if (rx > this.centerX - gapHalf && rx < this.centerX + gapHalf) continue;

          this.waterTrails.push({
            x: rx, 
            y: this.currentY + random(-5, 5) * scaleFactor,
            len: random(30, 80), 
            speed: random(4, 8),
            thickness: random(0.5, 1.8), 
            opacity: random(100, 200)
          });
        }
      }


      checkClick(mx, my) {
        if (activeWaveIdx === -1 && abs(my - this.currentY) < 35 * scaleFactor) {
          this.state = 'RISING';
          activeWaveIdx = this.id;
          hasBeenClicked = true;
          for(let i=0; i<60; i++) this.generateFullWidthTrails();
        }
      }
    }

    function mousePressed() {
      for (let w of waves) w.checkClick(mouseX, mouseY);
    }

    function initProjectsFolder() {
      if (!graphicDesignGallery) return;
      graphicDesignGallery.innerHTML = '';

      const stage = document.createElement('div');
      stage.className = 'accordion-stage';
      stage.id = 'projectsAccordionStage';

      const pages = [];
      let activePageIdx = 0;
      let isAnimating = false;

      projectPages.forEach((proj, idx) => {
        const page = document.createElement('div');
        page.className = 'folder-page';
        page.dataset.idx = idx;

        const ripple = document.createElement('div');
        ripple.className = 'ripple-layer';
        page.appendChild(ripple);

        const contentWrapper = document.createElement('div');
        contentWrapper.className = 'page-content-wrapper';

        let imgHtml = '';
        if (proj.image) {
          imgHtml = `<img class="proj-image" src="${proj.image}" alt="${proj.title}">`;
        }

        const tagsHtml = proj.tags.map(t => `<span class="proj-tag">${t}</span>`).join('');

        contentWrapper.innerHTML = `
          <div class="proj-title">${proj.title}</div>
          <div class="proj-subtitle">${proj.subtitle}</div>
          ${imgHtml}
          <div class="proj-desc">${proj.desc}</div>
          <div class="proj-tags">${tagsHtml}</div>
        `;
        page.appendChild(contentWrapper);
        stage.appendChild(page);
        pages.push(page);
      });

      graphicDesignGallery.appendChild(stage);

      function foldPages() {
        const total = pages.length;
        if (total === 0) return;

        pages.forEach((page, i) => {
          const dist = i - activePageIdx;
          page.classList.remove('shadow-light', 'shadow-medium', 'shadow-heavy');

          if (dist === 0) {
            page.style.transformOrigin = 'center center';
            page.style.transform = 'translateX(0) translateZ(40px) rotateY(0deg)';
            page.style.zIndex = 50;
            page.style.boxShadow = '0 12px 40px rgba(0,0,0,0.25)';
          } else if (dist < 0) {
            const x = -80 + (activePageIdx - i - 1) * 20;
            const angle = -25 - (activePageIdx - i - 1) * 10;
            page.style.transformOrigin = 'right center';
            page.style.transform = `translateX(${x}px) translateZ(${-Math.abs(dist)*10}px) rotateY(${angle}deg)`;
            page.style.zIndex = 40 + dist;
            page.classList.add('shadow-medium');
          } else {
            const x = 80 + (i - activePageIdx - 1) * 20;
            const angle = 25 + (i - activePageIdx - 1) * 10;
            page.style.transformOrigin = 'left center';
            page.style.transform = `translateX(${x}px) translateZ(${-Math.abs(dist)*10}px) rotateY(${angle}deg)`;
            page.style.zIndex = 40 - dist;
            page.classList.add('shadow-light');
          }
        });
      }

      pages.forEach((page, idx) => {
        page.addEventListener('click', (e) => {
          if (isAnimating) return;
          if (idx === activePageIdx) return;
          isAnimating = true;
          activePageIdx = idx;
          foldPages();
          setTimeout(() => { isAnimating = false; }, 650);
        });
      });

      // Touch swipe support
      let touchStartX = 0;
      stage.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
      }, { passive: true });
      stage.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const diff = touchStartX - touchEndX;
        if (Math.abs(diff) < 50) return;
        if (diff > 0 && activePageIdx < pages.length - 1) {
          isAnimating = true;
          activePageIdx++;
          foldPages();
          setTimeout(() => { isAnimating = false; }, 650);
        } else if (diff < 0 && activePageIdx > 0) {
          isAnimating = true;
          activePageIdx--;
          foldPages();
          setTimeout(() => { isAnimating = false; }, 650);
        }
      }, { passive: true });

      setTimeout(foldPages, 50);
    }

    function hideAllGalleries() {
      [graphicDesignGallery, visualDisplayGallery, socialMediaGallery].forEach(g => {
        if (g) {

    function showGalleryForWave(waveId, opacity = null) {
      const targets = [graphicDesignGallery, visualDisplayGallery, socialMediaGallery];
      const target = targets[waveId];
      
      // Already showing? Just ensure opacity
      if (target && target.classList.contains('show') && target.style.display !== 'none') {
        target.style.opacity = 1;
        return;
      }
      
      hideAllGalleries();
      
      if (target) {
        target.style.display = 'flex';
        target.style.opacity = 1;
        target.classList.add('show');
      }
    }

    // 旧的图片点击处理（保留但不再使用，避免报错）
    function handleImageClick(e, item, imgPath, type) {
      e.stopPropagation();
    }

    // 弹出窗口功能 - 支持滚轮缩放和拖拽
    let currentScale = 1;
    let isDragging = false;
    let startX, startY, initialLeft, initialTop;
    let translateX = 0, translateY = 0;
    
    // 移动端双指缩放相关变量
    let initialPinchDistance = 0;
    let initialScale = 1;

    function openModal(imgPath) {
      if (!imageModal) return;
      const modalImage = document.getElementById('modalImage');
      if (modalImage) {
        modalImage.src = imgPath;
        imageModal.classList.add('show');
        
        // 重置状态
        resetImageState(modalImage);
        
        // 绑定事件
        setupModalEvents(modalImage);
      }
    }
    
    function resetImageState(img) {
      currentScale = 1;
      translateX = 0;
      translateY = 0;
      updateImageTransform(img);
      img.style.cursor = 'grab';
    }
    
    function updateImageTransform(img) {
      img.style.transform = `translate(${translateX}px, ${translateY}px) scale(${currentScale})`;
    }
    
    function setupModalEvents(img) {
      // 1. 鼠标滚轮缩放
      img.onwheel = (e) => {
        e.preventDefault();
        const delta = e.deltaY * -0.001; // 滚轮灵敏度
        const newScale = Math.min(Math.max(0.5, currentScale + delta), 5); // 限制缩放范围 0.5x - 5x
        currentScale = newScale;
        updateImageTransform(img);
      };
      
      // 2. 鼠标拖拽
      img.onmousedown = (e) => {
        e.preventDefault(); // 防止默认拖拽图片行为
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        img.style.cursor = 'grabbing';
      };
      
      window.onmousemove = (e) => {
        if (isDragging) {
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          translateX += dx;
          translateY += dy;
          startX = e.clientX;
          startY = e.clientY;
          updateImageTransform(img);
        }
      };
      
      window.onmouseup = () => {
        isDragging = false;
        img.style.cursor = 'grab';
      };
      
      // 3. 移动端双指缩放 & 单指拖拽
      img.ontouchstart = (e) => {
        if (e.touches.length === 2) {
          // 双指缩放开始
          e.preventDefault(); // 防止页面滚动
          initialPinchDistance = getDistance(e.touches[0], e.touches[1]);
          initialScale = currentScale;
        } else if (e.touches.length === 1) {
          // 单指拖拽开始
          isDragging = true;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
        }
      };
      
      img.ontouchmove = (e) => {
        e.preventDefault(); // 防止页面滚动
        if (e.touches.length === 2) {
          // 双指缩放中
          const currentDistance = getDistance(e.touches[0], e.touches[1]);
          if (initialPinchDistance > 0) {
            const scaleDiff = currentDistance / initialPinchDistance;
            currentScale = Math.min(Math.max(0.5, initialScale * scaleDiff), 5);
            updateImageTransform(img);
          }
        } else if (e.touches.length === 1 && isDragging) {
          // 单指拖拽中
          const dx = e.touches[0].clientX - startX;
          const dy = e.touches[0].clientY - startY;
          translateX += dx;
          translateY += dy;
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          updateImageTransform(img);
        }
      };
      
      img.ontouchend = (e) => {
        if (e.touches.length < 2) {
          initialPinchDistance = 0;
        }
        if (e.touches.length === 0) {
          isDragging = false;
        }
      };
      
      // 点击 modalContent (背景区域) 关闭
      const modalContent = document.querySelector('.modal-content');
      if (modalContent) {
         modalContent.onclick = (e) => {
           // 如果点击的是 modal-content 本身（即图片外围），而不是图片
           if (e.target === modalContent) {
             closeModal();
           }
         };
      }
      
      // 移除旧的点击事件，防止冲突
      img.onclick = (e) => {
        e.stopPropagation();
      };
    }
    
    function getDistance(touch1, touch2) {
      const dx = touch1.clientX - touch2.clientX;
      const dy = touch1.clientY - touch2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }
    
    function closeModal() {
      if (imageModal) {
        imageModal.classList.remove('show');
        // 解除全局事件绑定，防止内存泄漏或干扰
        window.onmousemove = null;
        window.onmouseup = null;
        
        // 恢复飞行的图片
        if (activeFlyingItem) {
            // 简单淡入恢复
            // 原元素一直在原地，只是隐藏了，所以直接淡入即可
            activeFlyingItem.style.transition = 'opacity 0.5s ease';
            activeFlyingItem.style.opacity = '1';
            activeFlyingItem.style.zIndex = ''; 
            
            activeFlyingItem = null;
        }
      }
    }

    // 点击背景关闭弹出窗口
    document.addEventListener('DOMContentLoaded', () => {
      const modalBackdrop = document.querySelector('.modal-backdrop');
      if (modalBackdrop) {
        modalBackdrop.addEventListener('click', closeModal);
      }
      
      // ESC键关闭
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeModal();
        }
      });
    });

    // 在draw循环中更新图片位置
    function draw() {
      clear(); // 使用 clear() 实现透明背景
      drawUI();
      updateTargetPositions();

      for (let w of waves) {
        w.update();
        w.display();
      }
    }
