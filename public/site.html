<html lang="zh-CN">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jackie's Sketchbook</title>
  <meta name="description" content="Personal portfolio and sketchbook">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=AR+One+Sans:wght@400;500&family=Special+Elite&family=Noto+Sans+HK:wght@400;500&family=Noto+Sans+SC:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.11/lib/p5.js"></script>
  <style>
    :root{--bg:#F2F2F1;--text:#666666;}
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{
      background:var(--bg);color:var(--text);line-height:1.7;
      -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    }
    .en-special{font-family:"Special Elite",serif;}
    .code{font-family:"AR One Sans",sans-serif;}
    .cn-serif{font-family:"Source Han Sans SC","Noto Sans HK","Noto Sans SC",sans-serif;}
    header{position:relative;background:transparent;z-index:100;}
    .nav{
      max-width:1200px;margin:10px auto 0;padding:0 24px;
      display:grid;grid-template-columns:1fr 1fr 1fr;align-items:center;font-size:14px;
    }
    .nav a{
      color:var(--text);text-decoration:none;opacity:.7;
      transition:all 0.2s ease;display:inline-block;transform-origin:bottom center;
    }
    .nav a:hover{opacity:1;}
    .nav a:active{color:#ccc;transform:perspective(500px) rotateX(60deg) skewX(-15deg);}
    .nav-left{justify-self:start;font-weight:500;opacity:.9;}
    .nav-center{justify-self:center;}
    .nav-right{justify-self:end;}
    .container{
      max-width:1200px;margin:-90px auto 0;padding:0 24px 80px;
      display:grid;grid-template-columns:1.05fr 1fr;gap:2px;
      align-items:start;min-height:calc(100vh - 180px);
    }
    .intro{padding:24px 0;display:flex;flex-direction:column;min-height:100px;}
    .intro-top{margin-bottom:20px;padding-top:210px;}
    .intro-cta{margin-top:150px;padding-left:320px;}
    .char{
      display:inline-block;opacity:0;
      transform:translateY(40px) skewY(10deg);
      animation:floatUpChar 1s cubic-bezier(0.25,0.46,0.45,0.94) forwards;
      white-space:pre;
    }
    @keyframes floatUpChar{
      0%{opacity:0;transform:translateY(40px) skewY(10deg) rotate(5deg);}
      100%{opacity:1;transform:translateY(0) skewY(0) rotate(0deg);}
    }
    @keyframes driftAway{
      0%{opacity:1;transform:translate(0,0) rotate(0deg);filter:blur(0);}
      100%{opacity:0;transform:translate(30px,-30px) rotate(15deg);filter:blur(3px);}
    }
    .intro h1,.intro h2,.intro p{margin:0;font-weight:500;font-size:18px;line-height:1.8;}
    .intro h1{margin-bottom:8px;}
    .visual{
      position:relative;width:100%;display:flex;justify-content:center;
      align-items:center;padding:12px 0;margin-top:40px;
    }
    .tree-wrap{position:relative;width:100%;max-width:520px;margin:0 auto;}
    .tree{width:100%;height:auto;display:block;opacity:1;pointer-events:none;transition:opacity 0.8s ease-out;}
    .label{
      position:absolute;color:var(--text);font-size:10px;
      writing-mode:vertical-rl;text-orientation:mixed;letter-spacing:0.5px;
      opacity:.9;z-index:20;pointer-events:auto;cursor:pointer;transition:opacity 0.2s;
      text-decoration:none;
    }
    .label:hover{opacity:1;}
    .label.experience{top:29%;left:25%;}
    .label.portfolio{top:54%;left:20%;}
    .label.introduction{top:56%;left:82%;}
    #p5-overlay{position:absolute;inset:0;z-index:10;pointer-events:auto;}
    #p5-overlay canvas{width:100%!important;height:auto!important;display:block;}
    footer{border-top:1px solid rgba(0,0,0,0.08);margin-top:24px;}
    .footer-inner{
      max-width:1200px;margin:0 auto;padding:18px 24px 28px;
      display:grid;grid-template-columns:repeat(3,1fr);gap:12px;font-size:13px;
    }
    .footer-item b{display:block;font-weight:500;margin-bottom:6px;}
    .footer-item a{color:inherit;text-decoration:none;}
    @media (max-width:1024px){
      .container{grid-template-columns:1fr;gap:12px;align-items:center;}
      .intro{text-align:center;min-height:auto;}
      .intro-cta{margin-top:32px;padding-left:0;}
      .visual{margin-top:0;}
      .visual .tree-wrap{max-width:420px;}
      .label{font-size:12px;}
      .label.experience{top:28%;left:25%;}
      .label.portfolio{top:53%;left:20%;}
      .label.introduction{bottom:18%;right:15%;top:auto;left:auto;}
    }
    @media (max-width:480px){
      .nav{padding:0 16px;font-size:12px;}
      .container{padding:0 16px 64px;margin-top:50px;}
      .intro{padding-top:0;}
      .intro-top{padding-top:0;margin-bottom:10px;}
      .intro-cta{margin-top:20px;}
      .intro h1,.intro h2,.intro p{font-size:15px;line-height:1.5;}
      .visual{margin-top:5px;}
      .visual .tree-wrap{max-width:400px;transform:translateX(-5%);}
      .label.introduction{top:56%;left:78%;bottom:auto;right:auto;}
      .footer-inner{grid-template-columns:1fr 1fr;row-gap:16px;font-size:12px;}
    }
  </style>
</head>
<body>

    <div class="footer-inner code">
      <div class="footer-item">
        <b>Email</b>

      </div>
      <div class="footer-item">
        <b>LinkedIn</b>
        <a href="https://www.linkedin.com/in/jackie-li6699" target="_blank" rel="noopener noreferrer">Jackie Li</a>

  <script>
    (function(){
      function animateChars(){
        var targets=[
          {id:'intro-h1',bd:0.1,drift:false},
          {id:'intro-h2',bd:0.2,drift:false},
          {id:'intro-cta',bd:2,drift:true}
        ];
        targets.forEach(function(t){
          var el=document.getElementById(t.id);
          if(!el) return;
          var text=el.textContent;
          var html='';
          for(var i=0;i<text.length;i++){
            var ch=text[i];
            var rd=Math.random()*0.8;
            var idx=i*0.02;
            var td=t.bd+rd+idx;
            if(t.drift){
              var vd=td+1+3+Math.random()*0.5;
              html+='<span class="char" style="animation-name:floatUpChar,driftAway;animation-duration:1s,2s;animation-delay:'+td+'s,'+vd+'s;animation-fill-mode:forwards,forwards;">'+ch+'</span>';
            }else{
              html+='<span class="char" style="animation-delay:'+td+'s">'+ch+'</span>';
            }
          }
          el.innerHTML=html;
        });
      }
      if(document.readyState==='loading'){
        document.addEventListener('DOMContentLoaded',animateChars);
      }else{
        animateChars();
      }
    })();
  </script>

  <script>
    // ====== Tree & Leaves - matched to original site behavior ======
    // States:
    //   0 = initial ambient (a few leaves fall gently to form thin layer, tree still)
    //   1 = hovering on tree (tree sways, leaves fall heavily)
    //   2 = finished (pile reached 1/4 height, tree still, no more leaves ever)
    var treeImg;
    var particles = [];
    var branchPoints = [];
    var poem = "Those hours that with gentle work did frame The lovely gaze where every eye doth dwell, Will play the tyrants to the very same And that unfair which fairly doth excel: For never-resting time leads summer on To hideous winter and confounds him there; Sap check'd with frost and lusty leaves quite gone, Beauty o'ersnow'd and bareness every where: Then, were not summer's distillation left, A liquid prisoner pent in walls of glass, Beauty's effect with beauty were bereft, Nor it, nor no remembrance what it was: But flowers distill'd, though they with winter meet, Leese but their show; their substance still lives sweet.";
    var poemIndex = 0;
    var groundMap = [];
    var currentSway = 0;
    var state = 0;
    var ambientCount = 0;
    var ambientTarget = 6;        // very few initial leaves for thin layer
    var ambientDelay = 60;
    var pileHeightLimit = 0;
    var heavySpawned = 0;
    var heavySpawnRate = 4;       // fewer leaves per frame (original was 12)
    var pileRatioTarget = 0.6;    // stop when 60% of ground reaches pile limit
    var mobileShakeTimer = 0;     // for mobile touch

    var config = {
      fontSize: 14,
      maxFallSpeed: 5.0,
      drag: 0.985,
      gravity: 0.15,
      letterSpacing: 24,
      pileLift: 4,
      driftRange: 0.5,
      rotateSpeed: 0.5,
      margin: 0.2,
      swayAmplitude: 0.015,       // gentler sway
      swayFreq: 0.04,             // slower sway
      swayLerp: 0.03,             // smoother transition
      groundY_ratio: 0.93,
      pileHeight_ratio: 0.25
    };

    function preload(){
      treeImg = loadImage('/images/tree.png');
    }

    function setup(){
      pixelDensity(1);
      var c = createCanvas(treeImg.width, treeImg.height);
      c.parent('p5-overlay');

      var groundY = height * config.groundY_ratio;
      for(var i = 0; i < width; i++) groundMap[i] = groundY;
      pileHeightLimit = groundY - height * config.pileHeight_ratio;

      treeImg.loadPixels();
      for(var x = 0; x < treeImg.width; x += 6){
        for(var y = 0; y < treeImg.height; y += 6){
          var idx = (x + y * treeImg.width) * 4;
          if(treeImg.pixels[idx + 3] > 50) branchPoints.push({x:x, y:y});
        }
      }

      textFont('Georgia');
      textSize(config.fontSize);
      textAlign(CENTER, CENTER);
    }

    class Leaf{
      constructor(x, y, ch){
        this.pos = createVector(x, y);
        this.vel = createVector(random(-0.5, 0.5), random(0.3, 0.8));
        this.acc = createVector(0, config.gravity);
        this.char = ch;
        this.landed = false;
        this.angle = random(TWO_PI);
        this.noiseSeed = random(1000);
        this.finalAngle = random(-0.4, 0.4);
      }
      update(){
        if(this.landed) return;
        var breeze = map(noise(this.noiseSeed, frameCount * 0.015), 0, 1, -config.driftRange, config.driftRange);
        this.vel.x += breeze * 0.15;
        this.vel.add(this.acc);
        this.vel.mult(config.drag);
        if(this.vel.y > config.maxFallSpeed) this.vel.y = config.maxFallSpeed;
        this.pos.add(this.vel);
        this.angle += this.vel.mag() * 0.08 * config.rotateSpeed;

        if(this.pos.y > height + 20){
          this.landed = true;
          this.pos.y = height * config.groundY_ratio;
          return;
        }

        var xIdx = floor(constrain(this.pos.x, 0, width - 1));
        var gy = groundMap[xIdx];
        if(this.pos.y >= gy){
          this.pos.y = gy;
          this.landed = true;
          this.finalAngle = random(-0.3, 0.3);
          var r = config.letterSpacing / 2;
          for(var i = -r; i <= r; i++){
            var cx = floor(constrain(xIdx + i, 0, width - 1));
            var lift = map(abs(i), 0, r, config.pileLift, 0);
            if(groundMap[cx] - lift > pileHeightLimit){
              groundMap[cx] -= lift;
            }
          }
        }
      }
      display(){
        push();
        translate(this.pos.x, this.pos.y);
        rotate(this.landed ? this.finalAngle : this.angle);
        fill(70, this.landed ? 200 : 160);
        noStroke();
        text(this.char, 0, 0);
        pop();
      }
    }

    function draw(){
      clear();

      var canvasElem = document.querySelector('#p5-overlay canvas');
      var eMX = mouseX, eMY = mouseY;
      if(canvasElem && canvasElem.offsetWidth > 0){
        eMX = mouseX * (width / canvasElem.offsetWidth);
        eMY = mouseY * (height / canvasElem.offsetHeight);
      }

      var m = width * config.margin;
      var isMouseHovering = (eMX > m && eMX < width - m && eMY > m && eMY < height - m);
      if(mobileShakeTimer > 0) mobileShakeTimer--;
      var isHovering = isMouseHovering || (mobileShakeTimer > 0);

      if(frameCount > 5){
        var st = document.querySelector('.tree');
        if(st) st.style.opacity = '0';
      }

      // ---- Calculate pile ratio (reused by sway and spawning) ----
      var pileReached = 0, pileSamples = 0;
      for(var gi = 0; gi < width; gi += 20){
        pileSamples++;
        if(groundMap[gi] <= pileHeightLimit + 15) pileReached++;
      }
      var pileRatio = pileReached / pileSamples;

      // ---- Sway logic ----
      // Tree ONLY sways during heavy leaf fall (state 1), then returns to still
      // No sway at rest (state 0), no sway after finish (state 2)
      var targetSway = 0;
      if(state === 1){
        var pileProgress = constrain(pileRatio / pileRatioTarget, 0, 1);
        var envelope = sin(pileProgress * PI);
        targetSway = sin(frameCount * config.swayFreq) * config.swayAmplitude * envelope;
      }
      currentSway = lerp(currentSway, targetSway, config.swayLerp);

      push();
      translate(width / 2, height);
      shearX(currentSway);
      image(treeImg, -width/2, -height, width, height);
      pop();

      // ---- Spawning logic ----
      if(state === 0){
        if(frameCount > ambientDelay && ambientCount < ambientTarget){
          if(frameCount % 15 === 0){
            spawnLeaf();
            ambientCount++;
          }
        }
        if(isHovering){
          state = 1;
          heavySpawned = 0;
        }
      }

      if(state === 1){
        if(pileRatio < pileRatioTarget){
          for(var i = 0; i < heavySpawnRate; i++){
            spawnLeaf();
            heavySpawned++;
          }
        }
        if(pileRatio >= pileRatioTarget){
          state = 2;
        }
      }
      // State 2: done forever, tree still, no more leaves

      // Update & display
      for(var i = particles.length - 1; i >= 0; i--){
        particles[i].update();
        particles[i].display();
      }

      // ---- Label sway (matches original exactly) ----
      // transformOrigin: top center -> top of label stays fixed, bottom swings
      // Labels follow tree sway + have their own gentle wind noise
      if(canvasElem){
        var ch = canvasElem.offsetHeight;
        var labels = [
          {sel:'.label.experience', h:0.71, n:100},
          {sel:'.label.portfolio', h:0.46, n:200},
          {sel:'.label.introduction', h:0.25, n:300}
        ];
        for(var li = 0; li < labels.length; li++){
          var l = labels[li];
          var el = document.querySelector(l.sel);
          if(el){
            // Horizontal shift follows tree: higher labels (larger h) move more
            var swayX = -ch * l.h * Math.tan(currentSway);
            // Wind noise - gentle even when tree is still
            var windNoise = noise(frameCount * 0.01 + l.n);
            var wind = (windNoise - 0.5) * 0.2;
            // Rotation: follows tree sway + wind
            var baseSway = currentSway * 0.9;
            var rot = baseSway + wind;
            // Soft skew for curved/dangling feel
            var softSkew = rot * 15;
            el.style.transformOrigin = 'top center';
            el.style.transform = 'translateX('+swayX+'px) rotate('+rot+'rad) skewX('+softSkew+'deg)';
          }
        }
      }
    }

    function spawnLeaf(){
      if(branchPoints.length === 0) return;
      var pt;
      var attempts = 0;
      do {
        pt = branchPoints[floor(random(branchPoints.length))];
        attempts++;
      } while(pt.y > height * 0.75 && attempts < 20);

      var ch = poem[poemIndex % poem.length];
      if(ch === " ") ch = poem[(poemIndex+1) % poem.length];
      particles.push(new Leaf(
        pt.x + random(-8, 8),
        pt.y + random(-15, 5),
        ch
      ));
      poemIndex++;
    }

    function mousePressed(){
      var ce = document.querySelector('#p5-overlay canvas');
      if(!ce) return;
      if(mouseX > 0 && mouseX < width && mouseY > 0 && mouseY < height){
        mobileShakeTimer = 180;
        if(state === 0){
          state = 1;
          heavySpawned = 0;
        }
      }
    }
    function touchStarted(){ mousePressed(); }
  </script>
</body>
</html>
